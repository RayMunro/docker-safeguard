<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Docker Safeguard{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  {% if user %}
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <img class="brand-mark" src="/static/icon.svg" alt="">
        <span>Docker Safeguard</span>
      </a>
      <nav class="topnav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/restore" class="{{ 'active' if request.url.path.startswith('/restore') else '' }}">Restore</a>
        <a href="/schedule" class="{{ 'active' if request.url.path.startswith('/schedule') else '' }}">Schedule</a>
        <a href="/logs" class="{{ 'active' if request.url.path.startswith('/logs') else '' }}">Logs</a>
        <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') else '' }}">Settings</a>
      </nav>
      <div class="topbar-right">
        <span class="muted">{{ user }}</span>
        <a href="/logout" class="btn btn-ghost btn-sm">Log out</a>
      </div>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">&copy; 2026 Ray Munro</footer>
  </div>
  {% else %}
    {% block auth_content %}{% endblock %}
  {% endif %}
</body>
</html>
